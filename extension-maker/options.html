<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הגדרות מכין השיעורים</title>
<style>
  body { font: 16px/1.5 "Segoe UI", Arial, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; } label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 10px; font: inherit; border: 1px solid #bbb; border-radius: 8px; direction: ltr; text-align: left; }
  button { margin: 16px 8px 0 0; padding: 10px 18px; font: inherit; border: 0; border-radius: 8px; background: #e65f00; color: #fff; cursor: pointer; }
  button.second { background: #fff; color: #e65f00; border: 2px solid #e65f00; }
  #msg { margin-top: 16px; min-height: 1.5em; } .ok { color: #137333; } .bad { color: #b3261e; }
  small { color: #666; }
</style>
</head>
<body>
  <h1>⚙️ הגדרות מכין השיעורים</h1>
  <label for="address">כתובת PageLens</label>
  <input id="address" placeholder="https://pagelens.datashellv.com">
  <label for="key">מפתח צוות</label>
  <input id="key" type="password" placeholder="pl_...">
  <small>את המפתח מקבלים בדף הראשי של PageLens (מסמנים "מפתח צוות"). הוא נשמר רק בדפדפן הזה.</small>
  <div><button id="save">שמירה</button><button id="test" class="second">בדיקת חיבור</button></div>
  <p id="msg" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
